name: Test

# Build and run the headless test suite. Runs on every push, manual dispatch,
# and on pull requests.
on:
  push:
  workflow_dispatch:
  pull_request:

jobs:
  test:
    name: Build and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DYAGLT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: cd build && ctest --output-on-failure
